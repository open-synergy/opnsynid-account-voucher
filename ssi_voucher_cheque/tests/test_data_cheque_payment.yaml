scenarios:
  - name: "Cheque Payment - Full Workflow (draft to done)"
    steps:
      - step: "Create debit account for cheque payment test"
        action: "create"
        model: "account.account"
        save_as: "debit_account"
        values:
          name: "Test Expense Account (Cheque Payment)"
          code: "XCPYT_DR01"
          user_type_id: "REF: account.data_account_type_expenses"

      - step: "Get demo bank journal"
        action: "ref"
        xml_id: "ssi_voucher_bank_cash.demo_journal1"
        save_as: "bank_journal"

      - step: "Get demo bank account"
        action: "ref"
        xml_id: "ssi_voucher_bank_cash.demo_account1"
        save_as: "bank_account"

      - step: "Create cheque payment in draft"
        action: "create"
        model: "account.cheque_payment"
        save_as: "cheque_payment"
        as_user: "base.user_admin"
        values:
          description: "Test Cheque Payment Full Workflow"
          journal_id: "EVAL: registry['bank_journal'].id"
          account_id: "EVAL: registry['bank_account'].id"
          date_issue: "2024-01-15"
          amount: 100.0
          line_ids:
            - - 0
              - 0
              - name: "Test Debit Line"
                account_id: "EVAL: registry['debit_account'].id"
                type: "dr"
                amount: 100.0

      - step: "Assert cheque payment created in draft"
        action: "assert"
        target: "cheque_payment"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          amount:
            type: "value"
            expected: 100.0

      - step: "Confirm cheque payment"
        action: "call"
        target: "cheque_payment"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "cheque_payment"
        method: "invalidate_cache"

      - step: "Approve cheque payment"
        action: "call"
        target: "cheque_payment"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Invalidate cache after open"
        action: "call"
        target: "cheque_payment"
        method: "invalidate_cache"

      - step: "Post cheque payment"
        action: "call"
        target: "cheque_payment"
        method: "action_done"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "done"

  - name: "Cheque Receipt - Full Workflow (draft to done)"
    steps:
      - step: "Create credit account for cheque receipt test"
        action: "create"
        model: "account.account"
        save_as: "credit_account"
        values:
          name: "Test Revenue Account (Cheque Receipt)"
          code: "XCRT_CR02"
          user_type_id: "REF: account.data_account_type_revenue"

      - step: "Get demo bank journal"
        action: "ref"
        xml_id: "ssi_voucher_bank_cash.demo_journal1"
        save_as: "bank_journal"

      - step: "Get demo bank account"
        action: "ref"
        xml_id: "ssi_voucher_bank_cash.demo_account1"
        save_as: "bank_account"

      - step: "Create cheque receipt in draft"
        action: "create"
        model: "account.cheque_receipt"
        save_as: "cheque_receipt"
        as_user: "base.user_admin"
        values:
          description: "Test Cheque Receipt Full Workflow"
          journal_id: "EVAL: registry['bank_journal'].id"
          account_id: "EVAL: registry['bank_account'].id"
          date_issue: "2024-01-15"
          amount: 150.0
          line_ids:
            - - 0
              - 0
              - name: "Test Credit Line"
                account_id: "EVAL: registry['credit_account'].id"
                type: "cr"
                amount: 150.0

      - step: "Assert cheque receipt created in draft"
        action: "assert"
        target: "cheque_receipt"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm cheque receipt"
        action: "call"
        target: "cheque_receipt"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "cheque_receipt"
        method: "invalidate_cache"

      - step: "Approve cheque receipt"
        action: "call"
        target: "cheque_receipt"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Invalidate cache after open"
        action: "call"
        target: "cheque_receipt"
        method: "invalidate_cache"

      - step: "Post cheque receipt"
        action: "call"
        target: "cheque_receipt"
        method: "action_done"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "done"
