          amount: 200.0
          line_ids:
            - - 0
              - 0
              - name: "Test Credit Line"
                account_id: "EVAL: registry['credit_account'].id"
                type: "cr"
                amount: 200.0

      - step: "Assert giro receipt created in draft"
        action: "assert"
        target: "giro_receipt"
